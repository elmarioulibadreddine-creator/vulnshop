name: devsecops
on: [push]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks git -v /repo

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep
          semgrep scan --error --config p/owasp-top-ten app.py

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" aquasec/trivy fs --exit-code 1 --severity CRITICAL /src

  # A compléter pendant l'atelier 2 :
  #  - build de l'image + scan de l'image (Trivy)
  #  - SBOM (Syft) publié comme artefact
  #  - DAST : lancer l'application puis OWASP ZAP baseline sur http://localhost:5000
  trivy-image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Report non-blocking vulnerabilities
    - |
      echo "=== Vulnerability report: HIGH / MEDIUM / LOW ==="
      trivy image \
        --severity HIGH,MEDIUM,LOW \
        --exit-code 0 \
        "$IMAGE_NAME"

    # Security gate: CRITICAL vulnerabilities block the pipeline
    - |
      echo "=== Security gate: CRITICAL ==="
      trivy image \
        --severity CRITICAL \
        --exit-code 1 \
        "$IMAGE_NAME"