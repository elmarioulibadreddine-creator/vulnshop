name: devsecops
on: [push]

permissions:
  contents: read

jobs:
  secrets:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks git -v /repo

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep
          semgrep scan --error --config p/owasp-top-ten app.py

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" aquasec/trivy fs --exit-code 1 --severity CRITICAL /src

  # A compléter pendant l'atelier 2 :
  #  - build de l'image + scan de l'image (Trivy)
  #  - SBOM (Syft) publié comme artefact
  #  - DAST : lancer l'application puis OWASP ZAP baseline sur http://localhost:5000
  image-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} .

      # LOW / MEDIUM / HIGH -> warning/report only
      - name: Trivy vulnerability report
        run: |
          echo "=== Vulnerabilities: HIGH / MEDIUM / LOW ==="
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,MEDIUM,LOW \
            --exit-code 0 \
            myapp:${{ github.sha }}

      # CRITICAL -> pipeline fails
      - name: Trivy CRITICAL security gate
        run: |
          echo "=== Checking CRITICAL vulnerabilities ==="
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            myapp:${{ github.sha }}
  dast:
    needs: image-security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build image
      - name: Build image
        run: docker build -t myapp .

      # Start application
      - name: Start application
        run: docker run -d --name myapp -p 5000:5000 myapp

      # Wait until Flask starts
      - name: Wait for application
        run: sleep 5

      # OWASP ZAP baseline scan
      - name: OWASP ZAP
        run: |
          docker run --rm \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000